name: Debug RSS URL

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Test exact URL
        run: |
          url="https://feedmaker.kindle4rss.com/feeds/kesoview.weixin.xml"
          echo "Testing: $url"
          echo "--- Response Headers ---"
          curl -sI -o /dev/null -w "HTTP %{http_code}\nLocation: %{redirect_url}\nContent-Type: %{content_type}\ncf-cache-status: %{header_json cf-cache-status}\n" --max-time 15 "$url"
          echo "--- Response Body (first 500 chars) ---"
          curl -sL --max-time 15 "$url" | head -c 500
          echo ""
          echo "--- DNS lookup ---"
          dig +short feedmaker.kindle4rss.com || nslookup feedmaker.kindle4rss.com