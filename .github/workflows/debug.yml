name: Debug feedsky URL

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Test feedsky.com RSS
        run: |
          echo "=== Testing feed.feedsky.com/my1510 ==="
          status=$(curl -sL -o /tmp/rss.xml -w "%{http_code}" --max-time 15 "http://feed.feedsky.com/my1510")
          echo "HTTP Status: $status"
          echo "Size: $(wc -c < /tmp/rss.xml) bytes"
          echo "--- First 300 chars ---"
          head -c 300 /tmp/rss.xml
          echo ""
          
          echo ""
          echo "=== Testing HTTPS ==="
          status2=$(curl -sL -o /tmp/rss2.xml -w "%{http_code}" --max-time 15 "https://feed.feedsky.com/my1510")
          echo "HTTPS Status: $status2"
          echo "Size: $(wc -c < /tmp/rss2.xml) bytes"
          head -c 200 /tmp/rss2.xml