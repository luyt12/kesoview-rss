name: Debug RSS access

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Test RSS sources one by one
        run: |
          test_url() {
            local url="$1"
            local label="$2"
            echo "[$label] Testing: $url"
            status=$(curl -sL -o /tmp/rsstest.xml -w "%{http_code}" --max-time 10 "$url" 2>/dev/null)
            local exitcode=$?
            if [ $exitcode -ne 0 ]; then
              echo "  -> curl exit $exitcode (network error)"
            else
              echo "  -> HTTP $status, $(wc -c < /tmp/rsstest.xml) bytes"
              if [ "$status" = "200" ]; then
                echo "  -> CONTENT PREVIEW:"
                head -c 150 /tmp/rsstest.xml
                echo ""
              fi
            fi
          }

          echo "=== DNS TESTS ==="
          for host in feedsky.com feed.feedsky.com feedmaker.kindle4rss.com rsshub.app; do
            echo -n "[DNS] $host -> "
            getent hosts $host 2>/dev/null && echo "OK" || echo "FAILED"
          done

          echo ""
          echo "=== RSS TESTS ==="
          test_url "http://feed.feedsky.com/my1510" "HTTP"
          test_url "https://feed.feedsky.com/my1510" "HTTPS"
          test_url "http://feedmaker.kindle4rss.com/feeds/kesoview.weixin.xml" "kindle4rss"
          test_url "https://rsshub.app/feedsky/my1510" "rsshub_app"
          test_url "https://rsshub.app/rss2json?url=http://feed.feedsky.com/my1510" "rsshub_rss2json"
          test_url "https://api.rss2json.com/v1/api.json?rss_url=http://feed.feedsky.com/my1510&api_key=" "rss2json_api"
          test_url "https://www.feedsky.com/my1510/feed" "feedsky_www"
          echo ""
          echo "=== DONE ==="
