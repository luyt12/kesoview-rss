name: Debug RSS access

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Test RSS sources
        run: |
          echo "=== DNS resolution ==="
          for host in feedsky.com feed.feedsky.com feedmaker.kindle4rss.com rsshub.app; do
            echo -n "$host: "
            getent hosts $host 2>/dev/null || nslookup $host 2>/dev/null | grep "Address:" | tail -1 || echo "DNS FAILED"
          done

          echo ""
          echo "=== curl tests ==="
          for url in \
            "http://feed.feedsky.com/my1510" \
            "https://feed.feedsky.com/my1510" \
            "http://feedmaker.kindle4rss.com/feeds/kesoview.weixin.xml" \
            "https://rsshub.app/feedsky/my1510" \
            "https://rsshub.app/https://feed.feedsky.com/my1510" \
            "https://rsshub.app/rss2json?url=http://feed.feedsky.com/my1510" \
            "https://api.rss2json.com/v1/api.json?rss_url=http://feed.feedsky.com/my1510" \
            "https://www.feedsky.com/feed/get?i=my1510" \
            "https://www.feedsky.com/my1510/feed"; do
            echo "--- $url ---"
            status=$(curl -sL -o /tmp/rsstest.xml -w "%{http_code}" --max-time 15 "$url")
            echo "Status: $status Size: $(wc -c < /tmp/rsstest.xml)"
            if [ "$status" = "200" ]; then
              echo "FIRST 200:"
              head -c 200 /tmp/rsstest.xml
              echo ""
            fi
          done
