name: Fetch kesoview WeChat RSS Feed

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch RSS Feed
        run: |
          set -x
          echo "Fetching RSS..."
          curl -vL "https://feedmaker.kindle4rss.com/feeds/kesoview.weixin.xml" -o kesoview.weixin.xml 2>&1 | tee /tmp/curl.log
          echo "---File info---"
          ls -la kesoview.weixin.xml 2>&1 || echo "File not created"
          echo "---First 500 bytes---"
          head -c 500 kesoview.weixin.xml 2>/dev/null || echo "Cannot read"

      - name: Commit and push
        if: success()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add kesoview.weixin.xml
          git diff --staged --quiet && { echo "No changes"; exit 0; }
          git commit -m "📰 $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push && echo "Pushed successfully"